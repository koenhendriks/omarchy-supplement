# Phpstorm fixes

# 1. Apply the 'jb' tag to any floating JetBrains window
windowrule {
    name = tag-jetbrains-floating
    match:class = ^jetbrains-.+$
    match:float = true
    
    tag = +jb
}

# 2. Apply focus rules to anything with the 'jb' tag
windowrule {
    name = jetbrains-focus-fixes
    match:tag = jb
}

windowrule {
    name = tag-focus
    match:focus = true
    tag = +focus
}

windowrule {
    name = tag-remove-focus
    match:focus = false
    tag = -focus
}

# 3. Local history does not open as float window
windowrule {
    name = float-local-history
    # Match any title that starts with "Local History"
    match:title = ^(Local History).*
    
    # Force it to float
    float = on
    
    # Optional but recommended: Remember the size you drag it to
    persistent_size = on
}


# 4. Welcome phpstorm does not open as float window
windowrule {
    name = float-welcome-phpstorm
    # Match any title that starts with "Local History"
    match:title = ^(Welcome to PhpStorm).*
    
    # Force it to float
    float = on
    
    # Optional but recommended: Remember the size you drag it to
    persistent_size = on
}

windowrule {
    name = float-open-file
    # Match any title that starts with "Local History"
    match:title = ^(Open File).*
    
    # Force it to float
    float = on
    
    # Optional but recommended: Remember the size you drag it to
    persistent_size = on
}

windowrule {
    name = float-select-folder
    # Match any title that starts with "Local History"
    match:title = ^(Select Folder).*
    
    # Force it to float
    float = on

    # Allow mouse to leave focus
    stay_focused = false
    
    # Optional but recommended: Remember the size you drag it to
    persistent_size = on
}

## Zen-cal for waybar
windowrule {
  name = zencal-rule
  float = on
  workspace = current, silent
  move = ((monitor_w-1280-520)) ((monitor_h*0.03))
  size = ((monitor_w*0.1)) ((monitor_h*0.2))
  match:title = ^(.*zen-cal.*)$
  match:class = ^(org\.kde\.konsole)$
}




