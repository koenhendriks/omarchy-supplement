# Windows config
##################

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/

windowrule {
    name = float-telegram
    match:class = ^(org\.telegram\.desktop)$
    
    # Force the window to float
    float = on
    
    # Store its size internally so it remembers exactly how big you left it
    persistent_size = on
}

