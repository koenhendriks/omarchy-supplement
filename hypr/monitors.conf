# The Dell monitor (Top, Centered)
# Resolution: 2560x1440 @ 60Hz | Position: starts at X:1280, Y:0 | Scale: 1
monitor=HDMI-A-1, 2560x1440@59.95, 1280x0, 1

# The AOC Ultrawide monitor (Primary, Bottom)
# Resolution: 5120x1440 @ 120Hz | Position: starts at X:0, Y:1440 (below the Dell) | Scale: 1
monitor=DP-1, 5120x1440@120.00, 0x1440, 1

# --- Workspace Binding + Per-Monitor Layout ---
# Hyprland has no per-monitor layout setting, only per-workspace (layout:).
# So each monitor gets a fixed range of workspaces, and every workspace in
# that range pins the layout we want for that screen.
#
#   AOC ultrawide (DP-1, bottom) -> workspaces 1-5,  master
#   Dell P2418D   (HDMI-A-1, top) -> workspaces 6-10, dwindle
#
# `default:true` sets which workspace each monitor opens on at startup.

# AOC Ultrawide (bottom) - master layout
workspace=1, monitor:DP-1, default:true, layout:master
workspace=2, monitor:DP-1, layout:master
workspace=3, monitor:DP-1, layout:master
workspace=4, monitor:DP-1, layout:master
workspace=5, monitor:DP-1, layout:master

# Dell (top) - dwindle layout
workspace=6, monitor:HDMI-A-1, default:true, layout:dwindle
workspace=7, monitor:HDMI-A-1, layout:dwindle
workspace=8, monitor:HDMI-A-1, layout:dwindle
workspace=9, monitor:HDMI-A-1, layout:dwindle
workspace=10, monitor:HDMI-A-1, layout:dwindle
