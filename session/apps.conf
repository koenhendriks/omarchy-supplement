# Apps whose windows are saved on shutdown and restored at login.
#
# Everything not listed here is ignored. `hypr-session save -v` prints what it
# skipped and the matcher line that would have caught it, so the way to add an
# app is: open it, run that, and paste the suggested line in here.
#
# This file is yours. install-session.sh seeds it once and never overwrites it.
#
# Lines are parsed with shell-style quoting, so a value containing a space must
# be quoted -- see the Chrome entries below.
#
# Matchers, one per line:
#
#   id:<desktop-entry-id>   Matched against the systemd scope of the window's
#                           process, which is where the launcher identity
#                           actually survives. Omarchy starts apps through uwsm,
#                           so /proc/<pid>/cgroup ends in one of:
#                             app-<id>-<pid>.scope            (GLib launched)
#                             app-Hyprland-<name>-<hex8>.scope (uwsm launched)
#                             app-<id>@autostart.service      (XDG autostart)
#
#   class:<hyprland class>  Matched case-insensitively against initialClass, for
#                           windows whose scope carries no usable id. Use the
#                           class hyprctl reports, NOT a desktop file's
#                           StartupWMClass -- they disagree (Sublime ships
#                           StartupWMClass=subl but its class is sublime_text).
#
#   chrome:<profile dir>    A Chrome window, matched on the --profile-directory
#                           in its own cmdline. Chrome runs one process per
#                           profile, so this is per-window readable. The value is
#                           the literal directory name under
#                           ~/.config/google-chrome. Chrome omits the flag for
#                           the default profile, which is recorded as "Default".
#
# Options, whitespace separated, all optional:
#
#   mode=single   Relaunch at most once no matter how many windows were saved,
#                 and not at all if the app is already running. Correct for
#                 every single-instance app: launching Chrome again just pops a
#                 window onto the current workspace. This is the default.
#   mode=multi    Relaunch (saved count - running count) times. For terminals.
#   desktop=<id>  Relaunch via this desktop entry instead of the matched id.
#   launch=<cmd>  Relaunch with this command instead of a desktop entry.
#   probe=<pat>   pgrep -f pattern for the already-running check, when the
#                 process name alone is not distinctive enough.
#   off           Keep the line but stop saving and restoring it.

# --- browsers -------------------------------------------------------------
#
# desktop= points at the per-profile launchers install-chrome-profiles.sh
# writes; they already carry --profile-directory, so the restore adds only
# --restore-last-session and never has to quote a profile name.
#
# No probe= here: the already-running check for Chrome is per profile and cannot
# be a pgrep pattern, because the default profile is the one with no
# --profile-directory flag at all and pgrep has no negative match.
chrome:"Default"        desktop=google-chrome-koen
chrome:"Profile 1"      desktop=google-chrome-yourhosting

# --- editors and IDEs -----------------------------------------------------
#
# PhpStorm reopens its own last project, which is the only way that is
# recoverable: its Exec takes %f and nothing outside the IDE records which
# project a given window held.
id:jetbrains-phpstorm
id:sublime_text

# --- chat -----------------------------------------------------------------
#
# Slack is also an XDG autostart entry (~/.config/autostart/slack.desktop), so
# at login systemd is starting it at the same moment the restore runs. The
# restore's already-running check covers that, but it means Slack usually gets
# placed by a post-hoc move rather than by a launch rule. To hand ownership to
# the restore instead, add Hidden=true to that autostart entry.
id:slack
id:teams-for-linux
# id:org.telegram.desktop

# --- terminals ------------------------------------------------------------
#
# mode=multi because several terminals are normal. Terminals are launched by
# raw command rather than a desktop entry, so their scope has no id and class:
# is what catches them. The saved working directory is read from the shell
# inside the terminal, not from foot itself, whose own cmdline records only
# where it was first started.
#
# A terminal running a Claude Code session is reopened on that same conversation
# (`claude --resume <id>`) rather than as a bare shell. Nothing to configure.
class:foot              mode=multi  launch='uwsm-app -- foot.desktop'
