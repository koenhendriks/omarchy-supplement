// logid, the logiops daemon, driving the MX Master's thumb button.
//
// The button is Logitech's App_Switch_Gesture. Left alone it emits a canned
// SUPER + TAB in firmware and reports neither a button code nor a direction, so
// nothing at the evdev layer can tell a click from a hold-and-move. Getting a
// direction out of it means diverting the button over HID++ and reading the raw
// XY that the mouse then reports; logid's Gestures action does both.
//
// Actions are Keypress rather than a shell-out on purpose. logid runs as a root
// system service with no Hyprland environment, so it cannot talk to the
// compositor socket -- but it does not need to. Keypress injects real key events
// through uinput, which Hyprland picks up as ordinary keybindings, so the
// gestures ride on Omarchy's existing SUPER + TAB bindings instead of
// reimplementing them. See the hyprctl note in README.md for the other reason
// not to shell out.
//
// Two devices, two blocks, because logiops matches on an exact device name:
// `name` is a required single string with no wildcard and no default section, so
// a shared block is not available however identical the two configs are. The
// names come from HID++ feature 0x0005 and are not what the Bluetooth pairing or
// any UI shows -- the 3S pairs as "MX Master 3S B" and shows as "MX Master 3S",
// and the older mouse shows as "MX Master 3" while reporting the longer name
// below. Read the real one off logid itself:
//
//   sudo systemctl stop logid && sudo logid -v
//
// which also prints the remappable-button table, so it confirms in one go that
// cid 0xc3 is present and gesture-capable on a mouse being added here.
//
// Omarchy binds SUPER + TAB to "Next workspace" and SUPER + SHIFT + TAB to
// "Previous workspace"; check with `hyprctl binds`. Gestures land on release, so
// each one is a single step -- there is no 1:1 glide here, see README.md.

devices: (
{
    name: "Wireless Mouse MX Master 3";

    buttons: (
        {
            // 0xc3 is the thumb button. The full control set this mouse
            // exposes is 0x50/0x51 left/right, 0x52 middle, 0x53 back,
            // 0x56 forward, 0xc3 thumb, 0xc4 smart shift.
            cid: 0xc3;
            action:
            {
                type: "Gestures";
                gestures: (
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
                    },
                    // Pressing without moving. Diverting the button takes away
                    // the firmware SUPER + TAB, and SUPER + TAB is "Next
                    // workspace", so this hands back exactly what diversion
                    // removed.
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
                    }
                );
            };
        }
    );
},
{
    // The 3S is the same body with quieter switches and a finer sensor, and it
    // keeps the thumb button on the same control id, so this is the block above
    // with only the name changed.
    name: "MX Master 3S";

    buttons: (
        {
            cid: 0xc3;
            action:
            {
                type: "Gestures";
                gestures: (
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
                    },
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
                    }
                );
            };
        }
    );
}
);
