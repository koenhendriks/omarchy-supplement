// logid, the logiops daemon, driving the MX Master 3's thumb button.
//
// The button is Logitech's App_Switch_Gesture. Left alone it emits a canned
// SUPER + TAB in firmware and reports neither a button code nor a direction, so
// nothing at the evdev layer can tell a click from a hold-and-move. Getting a
// direction out of it means diverting the button over HID++ and reading the raw
// XY that the mouse then reports; logid's Gestures action does both.
//
// Actions are Keypress rather than a shell-out on purpose. logid runs as a root
// system service with no Hyprland environment, so it cannot talk to the
// compositor socket -- but it does not need to. Keypress injects real key events
// through uinput, which Hyprland picks up as ordinary keybindings, so the
// gestures ride on Omarchy's existing SUPER + TAB bindings instead of
// reimplementing them. See the hyprctl note in README.md for the other reason
// not to shell out.

devices: (
{
    // As reported by HID++ feature 0x0005, which is not the "MX Master 3"
    // shown in most UIs. Confirm with: sudo systemctl stop logid && sudo logid -v
    name: "Wireless Mouse MX Master 3";

    buttons: (
        {
            // 0xc3 is the thumb button. The full control set this mouse
            // exposes is 0x50/0x51 left/right, 0x52 middle, 0x53 back,
            // 0x56 forward, 0xc3 thumb, 0xc4 smart shift.
            cid: 0xc3;
            action:
            {
                type: "Gestures";

                // Omarchy binds SUPER + TAB to "Next workspace" and
                // SUPER + SHIFT + TAB to "Previous workspace"; check with
                // `hyprctl binds`. Gestures land on release, so each one is a
                // single step -- there is no 1:1 glide here, see README.md.
                gestures: (
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
                    },
                    // Pressing without moving. Diverting the button takes away
                    // the firmware SUPER + TAB, and SUPER + TAB is "Next
                    // workspace", so this hands back exactly what diversion
                    // removed.
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action: { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
                    }
                );
            };
        }
    );
}
);
